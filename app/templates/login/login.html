<!-- Login Modal -->
<div id="loginModal" class="hidden fixed inset-0 z-[9999] flex items-center justify-center">
  <div class="absolute inset-0 bg-black/50"></div>

  <div class="relative bg-white w-11/12 sm:w-96 rounded-lg shadow-lg p-6">
    <button id="closeLogin"
      class="absolute top-3 right-3 text-gray-500 hover:text-gray-700 text-lg font-bold">×</button>

    <h2 class="text-xl font-bold text-gray-800 mb-3">Login</h2>
    <p class="text-gray-600 text-sm mb-4">Enter your mobile number and password</p>

    <input id="mobileInput" type="text" maxlength="10"
      class="w-full border border-gray-300 rounded-lg px-4 py-2 mb-3 focus:ring-2 focus:ring-red-500 focus:outline-none"
      placeholder="Enter 10-digit mobile number">

    <input id="passwordInput" type="password"
      class="w-full border border-gray-300 rounded-lg px-4 py-2 mb-4 focus:ring-2 focus:ring-red-500 focus:outline-none"
      placeholder="Enter password">

    <button id="loginBtn"
      class="w-full bg-red-600 text-white font-semibold rounded-lg py-2 hover:bg-red-700">
      Login / Register
    </button>

    <p id="loginError" class="text-red-600 text-sm mt-3 hidden"></p>
  </div>
</div>
